  <script>
    document.documentElement.classList.add('js');
    // Pre-fetch the two above-the-fold fonts. Skipped on file:// (page opened by double-click), where browsers refuse CORS-mode preloads.
    if (location.protocol !== 'file:') {
      ['gfs-baskerville', 'inter-400'].forEach(function (n) {
        var l = document.createElement('link'); l.rel = 'preload'; l.as = 'font'; l.type = 'font/woff'; l.crossOrigin = 'anonymous'; l.href = './fonts/' + n + '.woff'; document.head.appendChild(l);
      });
    }
  </script>

  <div id="root"></div>
  <!--SEO-BODY-->

</body>
</html>
